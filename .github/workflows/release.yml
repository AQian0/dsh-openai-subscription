# npm trusted publisher settings:
# - Organization or user: AQian0
# - Repository: dsh-openai-subscription
# - Workflow filename: release.yml
# - Environment: npm
# - Allowed action: npm publish

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsh-openai-subscription
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.6.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version (expected $expected_tag)." >&2
            exit 1
          fi

      - name: Typecheck, build, and test
        run: pnpm run check

      # npm CLI performs the OIDC exchange required by npm trusted publishing.
      # The package lifecycle scripts remain package-manager agnostic.
      - name: Publish to npm
        run: npm publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json url >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; skipping creation."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
